services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "Europe/London"
      WEBPASSWORD: changeme
    volumes:
      - ./etc-pihole:/etc/pihole
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
